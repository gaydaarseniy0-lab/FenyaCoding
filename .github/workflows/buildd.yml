name: Build FenyaCoding APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract base project and v1.2 update
        run: |
          mkdir project
          unzip -oq FenyaCoding-Android-v1-phone-build.zip -d project
          python3 - <<'PY'
          import base64, io, zipfile
          from pathlib import Path
          raw = Path("FenyaCoding-Overlay.zip.b64").read_text().strip()
          candidates = [raw]
          if len(raw) % 4 == 1:
              candidates = [raw[:i] + raw[i+1:] for i in range(len(raw))]
          archive = None
          for candidate in candidates:
              try:
                  data = base64.b64decode(candidate, validate=True)
                  with zipfile.ZipFile(io.BytesIO(data)) as z:
                      if z.testzip() is None and any(n.endswith("MainActivity.kt") for n in z.namelist()):
                          archive = data
                          break
              except Exception:
                  pass
          if archive is None:
              raise SystemExit("Overlay archive is corrupted; no valid ZIP candidate found")
          Path("/tmp/fenya-overlay.zip").write_bytes(archive)
          PY
          unzip -oq /tmp/fenya-overlay.zip -d project
          find project -name settings.gradle.kts -print

      - name: Locate project
        run: |
          PROJECT_DIR=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Upload editable source
        run: zip -qr /tmp/FenyaCoding-Source.zip "$PROJECT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: FenyaCoding-Source
          path: /tmp/FenyaCoding-Source.zip

      - name: Align Java compile target
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          s = p.read_text()
          s += """
          
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
          p.write_text(s)
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FenyaCoding-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
